<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A chain is an ordered pivot list: each dimension is grouped by its left context and becomes a key for everything to its right">
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --box:#f6f8fa;
            --accent:#0969da; --accent-tint:rgba(9,105,218,.12); }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --box:#151b23;
              --accent:#4493f8; --accent-tint:rgba(68,147,248,.18); }
    }
    text { fill:var(--fg); }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill:var(--muted); }
    .accent { fill:var(--accent); }
    .lbl { font-size:11px; }
    .cap { font-size:12px; }
    .keybox { fill:var(--box); stroke:var(--line); stroke-width:1; }
    .dimbox { fill:var(--accent-tint); stroke:var(--accent); stroke-width:1; }
    .arrow { stroke:var(--muted); stroke-width:1.5; fill:none; }
  </style>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/>
    </marker>
  </defs>

  <!-- forward arrow: declared dimension is a key downstream -->
  <text class="cap muted" x="445" y="30" text-anchor="middle">…once declared, immediately a pivot key for everything to its right</text>
  <path class="arrow" d="M300,74 C360,38 520,38 575,76" marker-end="url(#ah2)"/>

  <!-- labels above boxes -->
  <text class="lbl muted"  x="50"  y="66" text-anchor="middle">existing key</text>
  <text class="lbl accent" x="180" y="66" text-anchor="middle">declares a dimension = new key</text>
  <text class="lbl accent" x="660" y="66" text-anchor="middle">declares a dimension</text>

  <!-- chain entry boxes -->
  <rect class="keybox" x="10"  y="78" width="80"  height="56" rx="8"/>
  <rect class="dimbox" x="105" y="78" width="325" height="56" rx="8"/>
  <rect class="dimbox" x="445" y="78" width="275" height="56" rx="8"/>
  <g class="mono" font-size="12">
    <text x="50"  y="110" text-anchor="middle">:County</text>
    <text x="117" y="101">:half =&gt;</text>
    <text x="117" y="119">dim"discretize(TestScr, quantiles = [.5])"</text>
    <text x="457" y="101">:top1 =&gt;</text>
    <text x="457" y="119">dim"topnames(District, TestScr, 1)"</text>
  </g>
  <g class="mono muted" font-size="13">
    <text x="97"  y="110" text-anchor="middle">,</text>
    <text x="437" y="110" text-anchor="middle">,</text>
  </g>

  <!-- left context of :half -->
  <text class="cap" x="105" y="162">left context of <tspan class="mono">:half</tspan> = <tspan class="mono">[:County]</tspan></text>
  <text class="cap muted" x="105" y="180">— median split per County</text>

  <!-- left context of :top1 -->
  <text class="cap" x="720" y="162" text-anchor="end">left context of <tspan class="mono">:top1</tspan> = <tspan class="mono">[:County, :half]</tspan></text>
  <text class="cap muted" x="720" y="180" text-anchor="end">— best District within each County-and-half</text>

  <!-- bottom note -->
  <text class="cap muted" x="10" y="236"><tspan class="mono" style="fill:var(--fg)">dim(df, chain)</tspan> adds :half and :top1&#160;&#160;·&#160;&#160;<tspan class="mono" style="fill:var(--fg)">agg(df, chain)</tspan> groups by all three keys and reduces the rest</text>
</svg>
